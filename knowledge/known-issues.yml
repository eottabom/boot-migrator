# =====================================================================================================================
# 알려진 이슈 레지스트리
#
# 컴파일/테스트가 통과해도 동작이 바뀌는 것, 레시피가 바꿨지만 사람이 확인해야 하는 것, 자동으로 바꾸면 위험한 것을 모은다.
# 공식 마이그레이션 가이드 / 릴리즈 노트와 실제 마이그레이션에서 겪은 문제를 같은 형식으로 쌓는다.
# 러너(MigrationRunner)가 단계마다 조건에 맞는 항목을 골라 리포트의 "알려진 이슈" 에 넣는다.
#
# 적용 조건 (둘 중 하나)
#   stage:       이 단계를 실행할 때. 3.0 ~ 4.1 | java21 | java25 | gradle
#     requires:  (선택) 단계 전후 classpath 에 이 의존성 중 하나라도 있을 때만. group:artifact, * 사용 가능
#   dependency:  단계 전후 resolve 된 버전이 바뀐 라이브러리 (group:artifact)
#     crosses:   이 버전을 넘어갈 때 (이전 < crosses <= 이후)
#     affected:  [from, until) 범위에 이후 버전이 들어갈 때
#
# mode
#   AUTO_FIX         레시피가 고친다 (fix 에 레시피 이름). 리포트에는 결과 확인용으로만 나온다
#   REVIEW_REQUIRED  레시피가 바꿨거나 바꿀 수 있지만, 설정/동작을 사람이 확인해야 한다
#   REPORT_ONLY      자동으로 바꾸지 않는다. 도메인/운영 판단이 필요하다
#
# 새 항목 추가 순서: 장애/버그 → 원인 → 재현 조건(단계 또는 라이브러리 버전) → 여기에 등록 → 가능하면 탐지/수정 레시피 작성
# =====================================================================================================================

guides:
  "3.0": https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0-Migration-Guide
  "3.1": https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.1-Release-Notes
  "3.2": https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.2-Release-Notes
  "3.3": https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.3-Release-Notes
  "3.4": https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.4-Release-Notes
  "3.5": https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.5-Release-Notes
  "4.0": https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
  "4.1": https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.1-Release-Notes
  java21: https://docs.openrewrite.org/recipes/java/migrate/upgradetojava21
  java25: https://docs.openrewrite.org/recipes/java/migrate/upgradetojava25
  gradle: https://docs.gradle.org/current/userguide/upgrading_version_8.html

issues:

  # ── Boot 3.0 ─────────────────────────────────────────────────────────────────────────────────────────────────────
  - id: boot30-trailing-slash
    stage: "3.0"
    mode: REPORT_ONLY
    title: URL 끝 슬래시 매칭 기본 비활성화
    detail: "`/api/foo/` 가 더 이상 `/api/foo` 에 매칭되지 않는다. 클라이언트/게이트웨이가 끝 슬래시를 붙여 호출하는지 확인하고, 필요하면 `WebMvcConfigurer.configurePathMatch()` 로 명시한다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0-Migration-Guide
  - id: boot30-log-date-format
    stage: "3.0"
    mode: REPORT_ONLY
    title: 기본 로그 날짜 형식이 ISO-8601 로 변경
    detail: "`yyyy-MM-dd HH:mm:ss.SSS` → `yyyy-MM-dd'T'HH:mm:ss.SSSXXX`. 로그 수집기(Fluentd/Logstash) 파싱 패턴이 깨질 수 있다. 유지하려면 `logging.pattern.dateformat`"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0-Migration-Guide
  - id: boot30-hibernate6
    stage: "3.0"
    requires: ["org.hibernate.orm:*", "org.hibernate:*"]
    mode: REVIEW_REQUIRED
    title: Hibernate 6.1 전환
    detail: "`@Type`/`@TypeDef` 문자열 기반 타입 제거, HQL 문법 엄격화. ID 시퀀스 이름(hibernate_sequence → 엔티티별 _seq) 변경은 레시피가 legacy 로 유지한다 (KeepLegacyIdGeneratorNaming)"
    fix: com.eottabom.rewrite.hibernate.KeepLegacyIdGeneratorNaming
    source: https://github.com/hibernate/hibernate-orm/blob/6.0/migration-guide.adoc
  - id: boot30-native-query-scalar-type
    stage: "3.0"
    requires: ["org.hibernate.orm:*", "org.hibernate:*"]
    mode: REPORT_ONLY
    title: 네이티브 쿼리 스칼라 결과 타입 변화
    detail: "Hibernate 6 은 네이티브 쿼리 결과를 JDBC 드라이버 타입 그대로 돌려준다. `(BigInteger) query.getSingleResult()` 처럼 캐스팅하던 COUNT/SUM 결과가 `Long`/`BigDecimal` 로 와서 ClassCastException 이 난다. `Number` 로 받아 변환한다"
    source: https://github.com/hibernate/hibernate-orm/blob/6.0/migration-guide.adoc
  - id: boot30-hypersistence-json-dates
    stage: "3.0"
    requires: ["io.hypersistence:*", "com.vladmihalcea:*"]
    mode: REPORT_ONLY
    title: Hypersistence JSON 컬럼 안의 날짜 형식
    detail: "Hypersistence 는 Spring 이 아닌 자체 ObjectMapper 를 써서 JSON 컬럼 안의 `LocalDate`/`LocalDateTime` 이 `[2024,1,1]` 배열로 저장될 수 있다. 기존 데이터와 이를 읽는 다른 시스템의 형식을 확인한다"
  - id: boot30-properties-rename
    stage: "3.0"
    mode: REVIEW_REQUIRED
    title: 설정 키 이름 변경 (spring.redis.* → spring.data.redis.* 등)
    detail: "upstream 레시피가 저장소 안 application*.yml 은 바꾼다. 외부 설정 저장소(Spring Cloud Config, Vault, Secrets Manager 등)의 키는 properties-migrator 경고로 확인한다. 그 밖에 `server.max-http-header-size` → `server.max-http-request-header-size`, `management.metrics.export.<product>` → `management.<product>.metrics.export`"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0-Migration-Guide
  - id: boot30-tracing-propagation
    stage: "3.0"
    requires: ["org.springframework.cloud:spring-cloud-starter-sleuth", "org.springframework.cloud:spring-cloud-sleuth-*", "io.micrometer:micrometer-tracing*"]
    mode: REPORT_ONLY
    title: Sleuth 제거 → Micrometer Tracing, 기본 전파 형식 W3C
    detail: "Sleuth 의 B3 헤더 대신 W3C traceparent 가 기본이다. 아직 Boot 2 인 서비스와 trace 가 끊긴다. 섞여 있는 동안은 `management.tracing.propagation.type=b3,w3c` 로 맞춘다. 설정 키는 `management.tracing.*`"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0-Migration-Guide
  - id: boot30-actuator-sanitize
    stage: "3.0"
    requires: ["org.springframework.boot:spring-boot-actuator*"]
    mode: REPORT_ONLY
    title: Actuator /env, /configprops 값이 기본으로 가려짐, JMX 는 health 만 노출
    detail: "`management.endpoint.env.show-values` / `configprops.show-values` (NEVER|ALWAYS|WHEN_AUTHORIZED). 운영 도구가 이 값을 읽고 있었다면 설정이 필요하다. Actuator 는 별도 ObjectMapper 를 쓴다 (`management.endpoints.jackson.isolated-object-mapper`)"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0-Migration-Guide
  - id: boot30-security-dispatcher
    stage: "3.0"
    requires: ["org.springframework.security:*"]
    mode: REPORT_ONLY
    title: Spring Security 6 필터가 모든 dispatch type 에 적용
    detail: "ERROR/FORWARD dispatch 에도 인가가 걸려 에러 페이지가 401/403 으로 바뀔 수 있다. `authorizeHttpRequests` 로 바뀌면서 기본 거부 규칙도 달라졌다. 인가 규칙 테스트를 확인한다 (`spring.security.filter.dispatcher-types`)"
    source: https://docs.spring.io/spring-security/reference/6.0/migration/index.html
  - id: boot30-httpclient4
    stage: "3.0"
    requires: ["org.apache.httpcomponents:httpclient"]
    mode: REVIEW_REQUIRED
    title: RestTemplate 의 Apache HttpClient 4 지원 제거
    detail: "upstream 레시피가 HttpClient 5 로 옮긴다. Elasticsearch 저수준 RestClient 처럼 HttpClient 4 가 계속 필요한 곳은 레시피가 되돌린다. 타임아웃/커넥션 풀 설정이 새 API 로 옮겨졌는지 확인한다"
    fix: com.eottabom.rewrite.httpclient.RevertHttpClient5ForElasticsearchRestClient
  - id: boot30-mysql-coordinates
    stage: "3.0"
    requires: ["mysql:mysql-connector-java"]
    mode: REVIEW_REQUIRED
    title: MySQL 드라이버 좌표 변경
    detail: "`mysql:mysql-connector-java` → `com.mysql:mysql-connector-j`. Boot BOM 은 새 좌표만 관리한다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0-Migration-Guide
  - id: boot30-batch
    stage: "3.0"
    requires: ["org.springframework.batch:*"]
    mode: REPORT_ONLY
    title: Spring Batch 5 자동 설정 변경
    detail: "`@EnableBatchProcessing` 을 쓰면 Boot 자동 설정이 꺼진다. Job 이 여러 개면 `spring.batch.job.name` 이 필요하다. 메타데이터 스키마도 바뀌었다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0-Migration-Guide
  - id: boot30-graceful-shutdown-phase
    stage: "3.0"
    mode: REPORT_ONLY
    title: 종료 단계(SmartLifecycle phase) 변경
    detail: "graceful shutdown 은 `DEFAULT_PHASE - 2048`, 웹 서버 종료는 `DEFAULT_PHASE - 1024`. 직접 만든 SmartLifecycle(컨슈머 정지 등) 순서를 확인한다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0-Migration-Guide
  - id: boot30-springdoc
    stage: "3.0"
    requires: ["org.springdoc:springdoc-openapi-ui", "org.springdoc:springdoc-openapi-webmvc-core"]
    mode: REPORT_ONLY
    title: springdoc 1.x 는 Boot 3 에서 동작하지 않음
    detail: "`springdoc-openapi-starter-webmvc-ui` 2.x 로 옮긴다. 설정 키도 일부 바뀐다"
  - id: boot30-sentry
    stage: "3.0"
    requires: ["io.sentry:*"]
    mode: REPORT_ONLY
    title: Sentry 는 Boot 3 용 artifact 가 다르다
    detail: "`sentry-spring-boot-starter` → `sentry-spring-boot-starter-jakarta`"

  # ── Boot 3.1 ─────────────────────────────────────────────────────────────────────────────────────────────────────
  - id: boot31-hibernate62-onetoone
    stage: "3.1"
    requires: ["org.hibernate.orm:*"]
    mode: REPORT_ONLY
    title: Hibernate 6.2, `@OneToOne` 에 unique 제약 생성
    detail: "ddl-auto 나 스키마 생성 도구를 쓰면 스키마가 바뀐다. 기존 데이터에 중복이 있으면 실패한다"
    source: https://github.com/hibernate/hibernate-orm/blob/6.2/migration-guide.adoc
  - id: boot31-hibernate62-timezone
    stage: "3.1"
    requires: ["org.hibernate.orm:*"]
    mode: REPORT_ONLY
    title: OffsetDateTime / ZonedDateTime 저장 방식 변경
    detail: "Hibernate 6.2 는 `hibernate.timezone.default_storage` 기본값이 바뀌어 DB 가 지원하면 오프셋을 함께 저장한다. 기존 데이터와 읽는 쪽 형식을 확인하고, 유지하려면 `NORMALIZE` 로 명시한다"
    source: https://github.com/hibernate/hibernate-orm/blob/6.2/migration-guide.adoc
  - id: boot31-registration-failure
    stage: "3.1"
    mode: REPORT_ONLY
    title: 서블릿/필터 등록 실패가 기동 실패로
    detail: "ServletRegistrationBean / FilterRegistrationBean 등록 실패가 경고 대신 IllegalStateException. 같은 이름 필터 중복 등록을 확인한다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.1-Release-Notes
  - id: boot31-health-group-validation
    stage: "3.1"
    requires: ["org.springframework.boot:spring-boot-actuator*"]
    mode: REPORT_ONLY
    title: health 그룹에 없는 indicator 를 넣으면 기동 실패
    detail: "`management.endpoint.health.group.*.include` 에 존재하지 않는 indicator 가 있으면 실패한다. 외부 설정의 그룹 정의를 확인한다 (`management.endpoint.health.validate-group-membership`)"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.1-Release-Notes
  - id: boot31-kafka-retry-topics
    stage: "3.1"
    requires: ["org.springframework.kafka:*"]
    mode: REPORT_ONLY
    title: Kafka retry topic 구성 변경
    detail: "maxDelay 에 도달한 재시도가 재시도마다 토픽을 만들지 않고 하나의 토픽으로 합쳐진다. 토픽 사전 생성/권한/모니터링을 확인한다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.1-Release-Notes

  # ── Boot 3.2 ─────────────────────────────────────────────────────────────────────────────────────────────────────
  - id: boot32-parameters
    stage: "3.2"
    mode: REPORT_ONLY
    title: 파라미터 이름 추론에 `-parameters` 컴파일 옵션 필요
    detail: "Spring Framework 6.1 은 바이트코드에서 이름을 추론하지 않는다. `@PathVariable`/`@RequestParam`/`@Cacheable(key=\"#id\")` 에서 이름을 생략하면 런타임 오류. Boot Gradle 플러그인을 적용하지 않은 모듈(공용 라이브러리 모듈 등)에 `-parameters` 를 켠다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.2-Release-Notes
  - id: boot32-nested-jar-launcher
    stage: "3.2"
    mode: REPORT_ONLY
    title: 실행 jar 로더 패키지 변경 (Dockerfile 확인)
    detail: "layered jar 를 풀어서 `java org.springframework.boot.loader.JarLauncher` 로 띄우던 Dockerfile 은 `org.springframework.boot.loader.launch.JarLauncher` 로 바꿔야 한다. 레시피는 저장소 밖 이미지 빌드 설정을 확인하지 못한다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.2-Release-Notes
  - id: boot32-feign-retryable
    stage: "3.2"
    requires: ["io.github.openfeign:*"]
    mode: AUTO_FIX
    title: Feign 12 RetryableException 생성자 변경
    detail: "null 인자 모호성은 레시피가 보정한다. 커스텀 ErrorDecoder 의 재시도 조건을 확인한다"
    fix: com.eottabom.rewrite.feign.DisambiguateRetryableExceptionNull
  - id: boot32-oracle-ucp
    stage: "3.2"
    requires: ["com.oracle.database.jdbc:ucp*"]
    mode: REPORT_ONLY
    title: Oracle UCP validateConnectionOnBorrow 기본값 해제
    detail: "유지하려면 `spring.datasource.oracleucp.validate-connection-on-borrow=true`"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.2-Release-Notes
  - id: boot32-security-user-backoff
    stage: "3.2"
    requires: ["org.springframework.security:*"]
    mode: REPORT_ONLY
    title: OAuth2/SAML2 가 있으면 InMemoryUserDetailsManager 자동 설정이 빠짐
    detail: "`spring.security.user.*` 를 설정하지 않았다면 기본 사용자 계정이 사라진다. 이 계정으로 붙던 actuator/내부 호출을 확인한다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.2-Release-Notes
  - id: boot32-otlp-endpoint
    stage: "3.2"
    requires: ["io.opentelemetry:*", "io.micrometer:micrometer-tracing-bridge-otel"]
    mode: REPORT_ONLY
    title: OTLP tracing endpoint 기본값 제거
    detail: "`management.otlp.tracing.endpoint` 를 명시하지 않으면 trace 를 보내지 않는다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.2-Release-Notes

  # ── Boot 3.3 ─────────────────────────────────────────────────────────────────────────────────────────────────────
  - id: boot33-logback15
    stage: "3.3"
    requires: ["net.logstash.logback:*"]
    mode: AUTO_FIX
    title: Logback 1.5, logstash-logback-encoder 8 필요
    detail: "레시피가 encoder 를 올린다. 커스텀 appender/encoder 가 있으면 출력 형식을 확인한다"
    fix: com.eottabom.rewrite.logging.UpgradeLogstashEncoder_8
  - id: boot33-flyway10
    stage: "3.3"
    requires: ["org.flywaydb:*"]
    mode: REPORT_ONLY
    title: Flyway 10, DB 별 모듈 필요
    detail: "PostgreSQL 은 `flyway-database-postgresql`, MySQL/MariaDB 는 `flyway-mysql` 등 DB 모듈을 선언하지 않으면 기동 시 `Unsupported Database` 로 실패한다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.3-Release-Notes
  - id: boot33-prometheus-client1
    stage: "3.3"
    requires: ["io.micrometer:micrometer-registry-prometheus"]
    mode: REPORT_ONLY
    title: Prometheus client 1.x 로 전환
    detail: "메트릭 노출 형식이 일부 달라진다. 대시보드/알람 쿼리를 확인한다. 0.x 를 유지하려면 `micrometer-registry-prometheus-simpleclient`"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.3-Release-Notes
  - id: boot33-entitygraph
    stage: "3.3"
    requires: ["org.hibernate.orm:*"]
    mode: REPORT_ONLY
    title: "@EntityGraph + 조건 조회 회귀 테스트"
    detail: "Hibernate 6.5 초기 패치(HHH-18378)에서 fetch 가 where 절 조인을 재사용해 결과가 중복됐다. 최신 패치로 올라가면 해결되지만, Hibernate 버전을 고정한 프로젝트는 확인한다 (수동 검토 대상에 위치 표시)"
    source: https://hibernate.atlassian.net/browse/HHH-18378

  # ── Boot 3.4 ─────────────────────────────────────────────────────────────────────────────────────────────────────
  - id: boot34-mockbean
    stage: "3.4"
    mode: AUTO_FIX
    title: "@MockBean/@SpyBean → @MockitoBean/@MockitoSpyBean"
    detail: "레시피가 전환한다. `@MockitoBean` 은 `@Configuration` 클래스에서 쓸 수 없으므로 설정 클래스에 선언한 mock 을 확인한다"
    fix: org.openrewrite.java.spring.boot4.ReplaceMockBeanAndSpyBean
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.4-Release-Notes
  - id: boot34-http-client-detection
    stage: "3.4"
    mode: REVIEW_REQUIRED
    title: RestTemplate/RestClient 기본 HTTP 클라이언트 자동 선택과 리다이렉트 변경
    detail: "우선순위 HttpComponents > Jetty > Reactor Netty > JDK. 클래스패스에 HttpComponents 가 있으면 그걸 쓰고, 모든 클라이언트가 기본으로 리다이렉트를 따라간다. 타임아웃/커넥션 풀/리다이렉트를 확인한다 (`spring.http.client.factory`, `spring.http.client.redirects`)"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.4-Release-Notes
  - id: boot34-httpclient5-envoy
    stage: "3.4"
    requires: ["org.apache.httpcomponents.client5:*"]
    mode: REPORT_ONLY
    title: HttpComponents 기본값 변경으로 Envoy/Istio 환경 오류 가능
    detail: "HTTP/1.1 TLS upgrade 기본 동작이 바뀌어 사이드카 프록시 뒤에서 요청이 실패할 수 있다. `HttpComponentsClientHttpRequestFactoryBuilder.withDefaultRequestConfigCustomizer()` 로 이전 동작을 복원한다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.4-Release-Notes
  - id: boot34-nested-validation
    stage: "3.4"
    mode: REPORT_ONLY
    title: "@ConfigurationProperties 중첩 객체 검증이 `@Valid` 없으면 조용히 빠짐"
    detail: "중첩 필드에 `@Valid` 가 없으면 그 안의 `@NotNull` 등이 더 이상 검사되지 않는다. 잘못된 설정으로도 기동되므로 검증이 필요한 중첩 필드에 `@Valid` 를 붙인다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.4-Release-Notes
  - id: boot34-graceful-shutdown
    stage: "3.4"
    mode: REPORT_ONLY
    title: graceful shutdown 기본 활성화
    detail: "종료 시 처리 중 요청을 기다린다 (`spring.lifecycle.timeout-per-shutdown-phase` 기본 30초). 배포 환경의 종료 유예 시간(Kubernetes terminationGracePeriodSeconds 등)보다 짧은지 확인한다. 끄려면 `server.shutdown=immediate`"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.4-Release-Notes
  - id: boot34-conditional-on-bean
    stage: "3.4"
    mode: REPORT_ONLY
    title: "@ConditionalOnBean/@ConditionalOnMissingBean 에 annotation 을 주면 반환 타입을 기본으로 쓰지 않음"
    detail: "직접 만든 자동 설정/조건부 빈이 다르게 등록될 수 있다. `value` 와 `annotation` 을 함께 지정한다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.4-Release-Notes
  - id: boot34-hibernate66
    stage: "3.4"
    requires: ["org.hibernate.orm:*"]
    mode: REPORT_ONLY
    title: Hibernate 6.6 검증 강화
    detail: "flush 시 저장 안 된(transient) 엔티티를 참조하면 `TransientObjectException`. `@GeneratedValue` id 를 직접 넣은 엔티티를 save 하면 merge 로 처리되고 대상 행이 없으면 `OptimisticLockException`. cascade 설정과 저장 순서, 테스트 픽스처의 id 지정을 코드에서 정리한다"
    source: https://docs.jboss.org/hibernate/orm/6.6/migration-guide/migration-guide.html
  - id: boot34-actuator-access
    stage: "3.4"
    requires: ["org.springframework.boot:spring-boot-actuator*"]
    mode: REVIEW_REQUIRED
    title: Actuator `enabled` → `access`
    detail: "`management.endpoint.<id>.enabled` → `management.endpoint.<id>.access` (none|read-only|unrestricted). 레시피가 저장소 yml 은 바꾼다. 외부 설정 저장소의 키는 properties-migrator 로 확인한다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.4-Release-Notes
  - id: boot34-testcontainers-dynamic-properties
    stage: "3.4"
    requires: ["org.testcontainers:*"]
    mode: REPORT_ONLY
    title: "@Bean 메서드에 DynamicPropertyRegistry 주입 deprecated"
    detail: "`DynamicPropertyRegistrar` 빈으로 옮긴다. `@AutoConfigureTestDatabase` 는 컨테이너 DB 를 자동 인식해 `replace=NONE` 이 필요 없어졌다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.4-Release-Notes
  - id: boot34-elasticsearch-range-query
    stage: "3.4"
    requires: ["co.elastic.clients:*"]
    mode: AUTO_FIX
    title: elasticsearch-java 8.15, RangeQuery 필드 이동
    detail: "Boot 3.4 BOM 이 8.15 로 올린다. `RangeQuery` 의 field/gte/lte 가 `UntypedRangeQuery` 로 옮겨졌고 레시피가 전환한다. 서버 버전 호환을 확인한다"
    fix: com.eottabom.rewrite.elasticsearch.MigrateRangeQueryToUntyped
  - id: boot34-empty-yaml-maps
    stage: "3.4"
    mode: REPORT_ONLY
    title: YAML 의 빈 맵이 무시됨
    detail: "`foo: {}` 처럼 빈 맵으로 기본값을 덮어쓰던 설정이 더 이상 적용되지 않는다 (properties 파일과 동작을 맞춤)"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.4-Release-Notes
  - id: boot34-htmlunit
    stage: "3.4"
    requires: ["net.sourceforge.htmlunit:*", "org.seleniumhq.selenium:htmlunit-driver"]
    mode: REVIEW_REQUIRED
    title: HtmlUnit 좌표/패키지 변경
    detail: "`net.sourceforge.htmlunit:htmlunit` → `org.htmlunit:htmlunit`, `com.gargoylesoftware.htmlunit.*` → `org.htmlunit.*`, `htmlunit-driver` → `htmlunit3-driver`"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.4-Release-Notes
  - id: boot34-okhttp
    stage: "3.4"
    requires: ["com.squareup.okhttp3:*"]
    mode: REPORT_ONLY
    title: OkHttp 버전을 Boot 가 더 이상 관리하지 않음
    detail: "버전 없이 선언했다면 직접 버전을 지정한다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.4-Release-Notes
  - id: boot34-redisson
    stage: "3.4"
    requires: ["org.redisson:*"]
    mode: REPORT_ONLY
    title: redisson-spring-data-XX 를 Spring Data 버전에 맞춘다
    detail: "Boot 3.4 = redisson-spring-data-34, 3.5 = 35, 4.0 = redisson 4.x. artifact 이름이 버전을 담고 있어 자동으로 올리지 않는다"

  # ── Boot 3.5 ─────────────────────────────────────────────────────────────────────────────────────────────────────
  - id: boot35-task-executor-name
    stage: "3.5"
    mode: REPORT_ONLY
    title: 자동 설정 TaskExecutor 의 `taskExecutor` 별칭 제거
    detail: "`@Async(\"taskExecutor\")`, `@Qualifier(\"taskExecutor\")` 처럼 이름으로 찾던 코드가 NoSuchBeanDefinitionException. `applicationTaskExecutor` 로 바꾼다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.5-Release-Notes
  - id: boot35-heapdump
    stage: "3.5"
    requires: ["org.springframework.boot:spring-boot-actuator*"]
    mode: REPORT_ONLY
    title: Actuator heapdump 기본 access 가 none
    detail: "운영 진단에 heapdump 를 쓰면 노출과 access 를 명시한다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.5-Release-Notes
  - id: boot35-strict-enabled
    stage: "3.5"
    mode: REPORT_ONLY
    title: "`.enabled` 설정값은 true/false 만 허용"
    detail: "이전에는 false 가 아니면 켜진 것으로 봤다. `enabled: yes`, `enabled: on`, 빈 값 등을 외부 설정까지 확인한다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.5-Release-Notes
  - id: boot35-profile-names
    stage: "3.5"
    mode: REPORT_ONLY
    title: 프로파일 이름 검증 강화
    detail: "문자, 숫자, `-`, `_` 만 가능하고 `-`/`_` 로 시작하거나 끝날 수 없다. 배포 파이프라인이 넘기는 프로파일 이름을 확인한다 (`spring.profiles.validate=false` 로 끌 수 있다)"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.5-Release-Notes
  - id: boot35-redis-url-database
    stage: "3.5"
    requires: ["org.springframework.data:spring-data-redis"]
    mode: REPORT_ONLY
    title: "`spring.data.redis.url` 이 있으면 `spring.data.redis.database` 무시"
    detail: "DB 번호는 URL 에 넣는다 (`redis://host:6379/2`)"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.5-Release-Notes
  - id: boot35-cleanup-deprecations
    stage: "3.5"
    mode: REPORT_ONLY
    title: 3.x 마지막 라인, 4.0 전에 deprecated API 정리
    detail: "Boot 4.0 은 3.x 에서 deprecated 된 것을 모두 제거한다. 리포트의 [removal]/deprecated 항목을 여기서 정리해야 4.0 단계가 컴파일된다"

  # ── Boot 4.0 ─────────────────────────────────────────────────────────────────────────────────────────────────────
  - id: boot40-jackson3
    stage: "4.0"
    mode: REVIEW_REQUIRED
    title: Jackson 3 기본 (`tools.jackson`)
    detail: "upstream 레시피가 패키지와 API 를 옮긴다. `ObjectMapper` 는 불변(`JsonMapper.builder()`), 커스텀 Serializer/Module 과 `catch (IOException)` 처리를 확인한다. `jackson-annotations` 는 `com.fasterxml.jackson.core` 그대로다. 설정 키 `spring.jackson.read/write.*` → `spring.jackson.json.read/write.*`"
    fix: com.eottabom.rewrite.jackson.FixJacksonIOExceptionCatch
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
  - id: boot40-jackson3-dates
    stage: "4.0"
    mode: REPORT_ONLY
    title: Jackson 3 는 날짜를 기본으로 ISO 문자열로 쓴다
    detail: "`WRITE_DATES_AS_TIMESTAMPS` 기본값이 false. 직접 만든 `new ObjectMapper()` + JavaTimeModule 로 `[2024,1,1]` 배열을 쓰던 곳(Elasticsearch 문서, Redis 캐시, 외부 연동)은 저장 형식이 바뀐다. Spring 이 만든 매퍼는 원래 문자열이라 영향 없다. 전환 중 Jackson 2 동작이 필요하면 `spring.jackson.use-jackson2-defaults=true`"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
  - id: boot40-custom-object-mapper-bean
    stage: "4.0"
    mode: REPORT_ONLY
    title: "`@Bean ObjectMapper` 로는 자동 설정 매퍼가 대체되지 않음"
    detail: "Boot 4 는 `JsonMapper` 빈을 자동 설정한다. 직접 정의한 `ObjectMapper` 빈의 설정이 Spring MVC/메시지 컨버터에 적용되지 않을 수 있으므로 `JsonMapper` 빈 또는 `JsonMapperBuilderCustomizer` 로 옮긴다. classpath 의 Jackson 모듈은 이제 자동 등록된다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
  - id: boot40-modular-starters
    stage: "4.0"
    mode: REVIEW_REQUIRED
    title: 모듈형 starter 와 자동 설정 패키지 이동
    detail: "`spring-boot-starter-web` → `-webmvc`, `-aop` → `-aspectj`, `-oauth2-*` → `-security-oauth2-*`. Flyway/Liquibase/RestClient/WebClient 는 전용 starter 가 필요하다. `org.springframework.boot.autoconfigure.*` 를 직접 import 하던 코드(`EntityScan` 등)는 패키지가 바뀐다. 레시피가 JPA 관련 이동은 보정한다"
    fix: com.eottabom.rewrite.spring.Boot4JpaRelocations
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
  - id: boot40-springboottest-mockmvc
    stage: "4.0"
    mode: REPORT_ONLY
    title: "@SpringBootTest 가 MockMvc / TestRestTemplate 을 자동으로 주지 않음"
    detail: "`@AutoConfigureMockMvc`, `@AutoConfigureTestRestTemplate` 또는 `@AutoConfigureRestTestClient` 를 붙인다. TestRestTemplate 은 `spring-boot-resttestclient` 모듈, 패키지 `org.springframework.boot.resttestclient`"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
  - id: boot40-mockito-listener
    stage: "4.0"
    mode: AUTO_FIX
    title: MockitoTestExecutionListener 제거
    detail: "Spring 테스트(@DataJpaTest 등) 안의 `@Mock`/`@InjectMocks` 가 자동 초기화되지 않는다. 레시피가 lenient MockitoExtension 을 붙인다 (upstream 의 strict 버전은 UnnecessaryStubbingException 을 낸다)"
    fix: com.eottabom.rewrite.testing.AddLenientMockitoExtension
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
  - id: boot40-spring-retry
    stage: "4.0"
    requires: ["org.springframework.retry:*"]
    mode: REVIEW_REQUIRED
    title: spring-retry 가 Boot BOM 에서 빠짐
    detail: "레시피가 `spring-retry` 2.0.x 를 선언해 기존 코드를 유지한다. Framework 7 core retry 로 옮길 때는 API 가 다르다. `maxAttempts` 는 재시도 횟수만 센다(spring-retry 의 3 은 첫 시도 포함), 실패는 checked `RetryException` 으로 감싸진다, 리스너에 재시도 횟수가 없다"
    fix: com.eottabom.rewrite.gradle.DeclareUsedDependency
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
  - id: boot40-elasticsearch-rest5
    stage: "4.0"
    requires: ["co.elastic.clients:*", "org.elasticsearch.client:*"]
    mode: AUTO_FIX
    title: Elasticsearch 저수준 RestClient → Rest5Client (HttpClient 5)
    detail: "레시피가 Rest5Client 로 옮기고 매퍼를 Jackson 3 용으로 맞춘다. `RestClientBuilderCustomizer` → `Rest5ClientBuilderCustomizer`. 서버 버전 호환과 날짜 형식을 개발 환경에서 확인한다"
    fix: com.eottabom.rewrite.elasticsearch.MigrateToRest5Client
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
  - id: boot40-batch-in-memory
    stage: "4.0"
    requires: ["org.springframework.batch:*"]
    mode: REPORT_ONLY
    title: spring-boot-starter-batch 가 기본으로 메타데이터를 DB 에 저장하지 않음
    detail: "재시작/중복 실행 방지가 DB 메타데이터에 의존하면 `spring-boot-starter-batch-jdbc` 로 바꾼다. 그대로 두면 조용히 in-memory 로 돈다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
  - id: boot40-junit4
    stage: "4.0"
    requires: ["junit:junit", "org.junit.vintage:*"]
    mode: REPORT_ONLY
    title: JUnit 4 지원 제거
    detail: "vintage engine 이 빠지면 JUnit 4 테스트가 실패하지 않고 조용히 실행되지 않는다. 리포트의 테스트 수가 줄었는지 확인하고 JUnit 5 로 옮긴다"
  - id: boot40-undertow
    stage: "4.0"
    requires: ["io.undertow:*"]
    mode: REPORT_ONLY
    title: Undertow 제거
    detail: "Servlet 6.1 을 지원하지 않아 빠졌다. Tomcat 또는 Jetty 로 옮긴다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
  - id: boot40-hibernate7
    stage: "4.0"
    requires: ["org.hibernate.orm:*"]
    mode: REVIEW_REQUIRED
    title: Hibernate 7.1
    detail: "`@Where` 등 deprecated API 제거, `org.hibernate.annotations.QueryHints` 제거(레시피가 보정), `hibernate-jpamodelgen` → `hibernate-processor`. 테스트 DDL 에서 enum 네이티브 타입/CHECK 제약 생성 방식이 달라진다"
    fix: com.eottabom.rewrite.hibernate.ReplaceAnnotationsQueryHints
    source: https://docs.jboss.org/hibernate/orm/7.0/migration-guide/migration-guide.html
  - id: boot40-testcontainers2
    stage: "4.0"
    requires: ["org.testcontainers:*"]
    mode: REVIEW_REQUIRED
    title: Testcontainers 2
    detail: "`org.testcontainers.shaded.*` 제거(레시피가 원래 라이브러리로 import 를 옮긴다), 일부 모듈명/클래스 변경"
    fix: com.eottabom.rewrite.java.UnshadeRelocatedImports
  - id: boot40-playtika
    stage: "4.0"
    requires: ["com.playtika.testcontainers:*"]
    mode: REPORT_ONLY
    title: playtika embedded-* 는 Boot/Cloud 버전에 강하게 묶여 있다
    detail: "Testcontainers + `@ServiceConnection` 으로 옮기는 것을 권장한다"
  - id: boot40-kafka-json-serializer
    stage: "4.0"
    requires: ["org.springframework.kafka:*"]
    mode: AUTO_FIX
    title: Spring Kafka 4 JacksonJsonSerializer 는 JsonMapper 만 받는다
    detail: "레시피가 보정한다. `spring.kafka.retry.topic.backoff.random` → `backoff.jitter`, `StreamBuilderFactoryBeanCustomizer` 제거"
    fix: com.eottabom.rewrite.kafka.UseJsonMapperForJacksonJsonSerializer
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
  - id: boot40-mongodb-properties
    stage: "4.0"
    requires: ["org.mongodb:*"]
    mode: REVIEW_REQUIRED
    title: MongoDB 설정 키 이동
    detail: "`spring.data.mongodb.*` 연결 설정 → `spring.mongodb.*`, `management.health.mongo.*` → `mongodb`. UUID/BigDecimal 표현을 명시해야 한다 (`spring.mongodb.representation.uuid`)"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
  - id: boot40-sentry
    stage: "4.0"
    requires: ["io.sentry:*"]
    mode: REPORT_ONLY
    title: Sentry 는 Boot 4 용 artifact 가 다르다
    detail: "`sentry-spring-boot-starter-jakarta` → `sentry-spring-boot-4`"
  - id: boot40-property-mapper
    stage: "4.0"
    mode: REPORT_ONLY
    title: PropertyMapper 가 null 값에 매핑을 호출하지 않음
    detail: "직접 만든 자동 설정에서 `PropertyMapper` 를 쓰면 null 처리 결과가 달라진다. `alwaysApplyingWhenNonNull()` 제거, null 도 넘기려면 `always()`"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
  - id: boot40-defaults
    stage: "4.0"
    mode: REPORT_ONLY
    title: 기본값 변경 (health probe, logback charset, devtools)
    detail: "liveness/readiness probe 가 기본으로 켜진다. Logback 파일 인코딩 기본값이 UTF-8. `spring.devtools.livereload.enabled` 기본 false. `spring.dao.exceptiontranslation.enabled` → `spring.persistence.exceptiontranslation.enabled`"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
  - id: boot40-nullability
    stage: "4.0"
    mode: REPORT_ONLY
    title: JSpecify null 어노테이션
    detail: "`org.springframework.lang.Nullable` 대신 `org.jspecify.annotations.Nullable`. NullAway 등 null 검사기를 쓰면 컴파일이 깨질 수 있다. Actuator 엔드포인트 파라미터는 JSpecify 만 인식한다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
  - id: boot40-war-tomcat
    stage: "4.0"
    requires: ["org.springframework.boot:spring-boot-starter-tomcat"]
    mode: REPORT_ONLY
    title: war 배포는 spring-boot-starter-tomcat-runtime
    detail: "외부 Tomcat 에 war 로 배포하면 starter 를 바꾸고, `server.forward-headers-strategy` 가 적용되지 않는 점을 확인한다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
  - id: boot40-jersey-jackson2
    stage: "4.0"
    requires: ["org.glassfish.jersey.*:*", "org.springframework.boot:spring-boot-starter-jersey"]
    mode: REPORT_ONLY
    title: Jersey 는 아직 Jackson 3 미지원
    detail: "`spring-boot-jackson2` 를 함께 쓴다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide

  # ── Boot 4.1 ─────────────────────────────────────────────────────────────────────────────────────────────────────
  - id: boot41-spring-cloud
    stage: "4.1"
    requires: ["org.springframework.cloud:*"]
    mode: REVIEW_REQUIRED
    title: Spring Cloud 2025.1.2 이상 필요
    detail: "Boot 4.1 은 2025.1.2 부터 지원한다. 레시피가 2025.1.x 최신으로 올린다. 그보다 낮게 고정돼 있으면 `CompatibilityVerifier` 로 기동이 실패한다"
    source: https://spring.io/projects/spring-cloud
  - id: boot41-layertools
    stage: "4.1"
    mode: REPORT_ONLY
    title: layertools jar mode 제거 (Dockerfile 확인)
    detail: "`java -Djarmode=layertools -jar app.jar extract` 를 쓰는 Dockerfile 은 `-Djarmode=tools extract --layers --launcher` 로 바꾼다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.1-Release-Notes
  - id: boot41-jpa-bootstrap
    stage: "4.1"
    requires: ["org.springframework.data:spring-data-jpa"]
    mode: REPORT_ONLY
    title: Spring Data JPA deferred bootstrap 은 AsyncTaskExecutor 빈 필요
    detail: "`spring.data.jpa.repositories.bootstrap-mode=deferred` 인데 AsyncTaskExecutor 가 없으면 기동 실패. lazy 모드는 자동 설정 executor 를 쓰지 않는다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.1-Release-Notes
  - id: boot41-jooq-java21
    stage: "4.1"
    requires: ["org.jooq:*"]
    mode: REPORT_ONLY
    title: jOOQ 3.20 은 Java 21 이상 필요
    detail: "Java 17 프로젝트는 `--java=21` 로 함께 올린다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.1-Release-Notes
  - id: boot41-derby
    stage: "4.1"
    requires: ["org.apache.derby:*"]
    mode: REPORT_ONLY
    title: Apache Derby 지원 deprecated
    detail: "프로젝트가 종료됐다. 테스트 DB 를 H2/HSQL 로 옮긴다"
    source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.1-Release-Notes

  # ── Java / Gradle ────────────────────────────────────────────────────────────────────────────────────────────────
  - id: java21-outside-repo
    stage: java21
    mode: REPORT_ONLY
    title: 배포 이미지와 CI 의 JDK 를 21 로
    detail: "Dockerfile 베이스 이미지, CI(setup-java 등), 배포 도구 설정은 저장소 밖이라 레시피가 못 바꾼다. JVM 옵션(제거/변경된 GC, 플래그)도 확인한다"
  - id: java21-mockito-agent
    stage: java21
    requires: ["org.mockito:*"]
    mode: REPORT_ONLY
    title: 동적 agent 로딩 경고 (Mockito inline)
    detail: "JDK 21 은 실행 중 agent 로딩에 경고를 낸다. 앞으로 기본 차단될 예정이므로 테스트 JVM 에 Mockito 를 `-javaagent` 로 붙이는 설정을 검토한다"
    source: https://openjdk.org/jeps/451
  - id: java21-jacoco-lombok
    stage: java21
    mode: AUTO_FIX
    title: JaCoCo / Lombok 최소 버전
    detail: "Java 21 클래스 파일을 읽으려면 JaCoCo 0.8.11+, Lombok 1.18.30+. 레시피가 올린다"
    fix: com.eottabom.rewrite.java.UpgradeToJava21
  - id: java25-outside-repo
    stage: java25
    mode: REPORT_ONLY
    title: 배포 이미지와 CI 의 JDK 를 25 로
    detail: "Dockerfile 베이스 이미지, CI, 배포 도구 설정은 저장소 밖이라 레시피가 못 바꾼다"
  - id: java25-gradle9
    stage: java25
    mode: REVIEW_REQUIRED
    title: Gradle 9.1 로 올라간다
    detail: "JDK 25 위에서 Gradle 을 띄우려면 9.1+ 가 필요하다. Gradle 9 에서 제거된 API 를 쓰는 서드파티 플러그인(구버전 freefair lombok, sonarqube, gradle-git-properties, asciidoctor 등)은 레시피가 올리고, 그 밖의 플러그인과 buildSrc 코드를 확인한다"
    fix: com.eottabom.rewrite.java.UpgradeToJava25
  - id: java25-lombok
    stage: java25
    requires: ["org.projectlombok:*"]
    mode: AUTO_FIX
    title: Lombok 1.18.40+ 는 Jackson 어노테이션을 accessor 로 복사하지 않음
    detail: "JDK 25 에 필요한 Lombok 버전에서 `@JsonProperty` 등이 getter/setter 로 복사되지 않아 직렬화 필드 이름이 바뀔 수 있다. 레시피가 lombok.config 로 복사를 켠다"
    fix: com.eottabom.rewrite.lombok.CopyJacksonAnnotationsToAccessors
  - id: java25-security-manager
    stage: java25
    mode: REPORT_ONLY
    title: SecurityManager 완전 제거
    detail: "이를 쓰던 라이브러리/설정(`-Djava.security.manager`)을 확인한다"
  - id: gradle-plugins
    stage: gradle
    mode: REVIEW_REQUIRED
    title: Gradle 8.14 와 서드파티 플러그인
    detail: "레시피가 wrapper 와 freefair / asciidoctor / gradle-git-properties 플러그인을 맞춘다. 그 밖의 플러그인과 buildSrc 가 Gradle 8.14 에서 동작하는지, deprecated 경고(Gradle 9 대비)를 확인한다"
    fix: com.eottabom.rewrite.gradle.UpgradeGradleToolchain_8_14
    source: https://docs.gradle.org/current/userguide/upgrading_version_8.html

