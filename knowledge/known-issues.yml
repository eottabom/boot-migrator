# 테스트 실패 원인별 참고. 가장 안쪽 예외(이름: 메시지)에 pattern(정규식)이 맞으면 리포트의 실패한 테스트에 한 줄 붙는다.
# 위에서부터 처음 맞는 것 하나만 쓴다 (구체적인 것을 위에 둔다).
failureHints:
  - pattern: "TransientObjectException"
    text: "Hibernate 6.6+ 검증 강화로 flush 시 저장 안 된(transient) 엔티티를 참조하면 예외. 연관 엔티티를 먼저 저장하거나 cascade 를 정리한다"
  - pattern: "(OptimisticLock|StaleObjectState).*Row was updated or deleted"
    text: "Hibernate 6.6+ 검증 강화로 @GeneratedValue id 를 직접 넣은 엔티티를 save 하면 merge 로 처리되고 대상 행이 없으면 예외. 픽스처에서 id 를 비우거나 persist 한다"
  - pattern: "ClassCastException.*BigInteger"
    text: "Hibernate 6 네이티브 쿼리 스칼라 결과는 드라이버 타입(Long/BigDecimal)이다. Number 로 받아 변환한다"
  - pattern: "parameter name information not available"
    text: "Spring Framework 6.1+: -parameters 컴파일 옵션이 없는 모듈이다. 컴파일 옵션을 켜거나 어노테이션에 이름을 명시한다"
  - pattern: "StreamConstraintsException"
    text: "Jackson 2.15+ 입력 크기 제한. StreamReadConstraints 를 조정한다"
  - pattern: "NoSuchBeanDefinitionException.*'taskExecutor'"
    text: "Boot 3.5 에서 자동 설정 executor 의 taskExecutor 별칭이 제거됐다. applicationTaskExecutor 로 바꾼다"
  - pattern: "(NoSuchBeanDefinitionException|UnsatisfiedDependencyException).*MockMvc"
    text: "Boot 4 의 @SpringBootTest 는 MockMvc 를 주지 않는다. @AutoConfigureMockMvc 를 붙인다"
  - pattern: "(NoSuchBeanDefinitionException|UnsatisfiedDependencyException).*TestRestTemplate"
    text: "Boot 4 에서는 @AutoConfigureTestRestTemplate 과 spring-boot-resttestclient 가 필요하다"
  - pattern: "(ClassNotFoundException|NoClassDefFoundError).*org\\.springframework\\.boot\\.(restclient|resttestclient|test\\.web\\.client)"
    text: "Boot 4 에서 RestTemplateBuilder / TestRestTemplate 은 spring-boot-restclient, spring-boot-resttestclient 모듈로 분리됐다. 테스트에 spring-boot-resttestclient 를 추가하고 @AutoConfigureTestRestTemplate 을 붙인다"
  - pattern: "SnippetException.*not documented"
    text: "REST Docs 응답에 문서에 없는 필드가 생겼다. Lombok 1.18.40 의 @JsonProperty 복사 중단(lombok.config 레시피가 보정), Jackson 직렬화 변경 확인"
  - pattern: "UnnecessaryStubbingException"
    text: "Mockito strict stubs 에서 쓰이지 않는 stubbing 이다. 테스트를 정리하거나 lenient 로 설정한다"
  - pattern: "Unsupported Database"
    text: "Flyway 10 부터 DB 별 모듈(flyway-database-postgresql, flyway-mysql 등)을 선언해야 한다"
  - pattern: "(NoSuchMethodError|NoSuchFieldError|NoClassDefFoundError|ClassNotFoundException|AbstractMethodError|IncompatibleClassChangeError)"
    text: "라이브러리 버전 불일치일 가능성이 크다. 리포트의 의존성 버전 변경 표에서 해당 라이브러리를 확인한다 (고정 버전이 BOM 과 어긋난 경우가 많다)"
  - pattern: "(BeanCurrentlyInCreationException|circular reference|Circular reference)"
    text: "빈 순환 참조는 Boot 2.6+ 에서 기본으로 금지된다. 생성자 주입 구조를 정리한다"
  - pattern: "(UnsatisfiedDependencyException|NoSuchBeanDefinitionException)"
    text: "빈을 찾지 못했다. auto-configuration 이동/제거(Boot 4 모듈 분리)나 조건부 빈을 확인한다"
