# 검토 후보만 검색한다. preconditions 는 파일 단위 필터이며 여러 개를 나열하면 AND 로 적용된다.
# 실제 결함/누락을 확정하지 않고, 같은 파일 밖의 설정 및 호출 흐름은 분석하지 않는다.
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.redis.FindRedisJsonSerializationCompatibilityRisk
displayName: "Redis JSON 캐시의 타입 정보와 기존 데이터 호환성 검토 후보 탐지"
description: "GenericJacksonJsonRedisSerializer 는 이전 serializer 와 달리 default typing 을 자동 활성화하지 않는다. RedisSerializer.json() 도 Jackson 3 으로 바뀐다. 기존 캐시를 새 serializer 로 읽는 회귀 테스트와 타입 허용 정책, null 캐시를 확인한다. 일괄 타입 허용이나 캐시 삭제를 자동 적용하지 않는다."
recipeList:
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: "org.springframework.data.redis.serializer.GenericJackson2JsonRedisSerializer"
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: "org.springframework.data.redis.serializer.GenericJacksonJsonRedisSerializer"
  - org.openrewrite.java.search.FindMethods:
      methodPattern: "org.springframework.data.redis.serializer.RedisSerializer json()"
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.spring.FindCatchAllHandlerMasking404
displayName: "전역 예외 처리기가 404 를 500 으로 바꿀 수 있음 검토 후보 탐지"
description: "Framework 6.1 의 NoResourceFoundException 이 기존 Exception/Throwable 전역 처리기에 잡힐 수 있다. 전용 처리기, advice 우선순위와 응답 상태를 확인하고 없는 API 및 정적 리소스가 404 를 반환하는지 테스트한다. 탐지 위치는 검토 후보이며 실제 500 반환 여부를 단정하지 않는다."
recipeList:
  - org.openrewrite.java.search.FindAnnotations:
      annotationPattern: "@org.springframework.web.bind.annotation.ExceptionHandler(java.lang.Exception.class)"
  - org.openrewrite.java.search.FindAnnotations:
      annotationPattern: "@org.springframework.web.bind.annotation.ExceptionHandler(java.lang.Throwable.class)"
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.security.FindSecurityContextPersistenceGap
displayName: "수동 로그인 후 SecurityContext 명시적 저장 확인 검토 후보 탐지"
description: "Security 6 기본 설정에서는 SecurityContextHolder 에 인증을 넣는 것만으로 다음 요청까지 저장되지 않는다. 세션 기반 수동 로그인은 선택한 SecurityContextRepository.saveContext 를 확인한다. stateless 인증이나 이미 저장하는 경로는 수정하지 않는다. 동일 세션의 후속 보호 API 요청을 테스트한다."
recipeList:
  - org.openrewrite.java.search.FindMethods:
      methodPattern: "org.springframework.security.core.context.SecurityContextHolder setContext(..)"
  - org.openrewrite.java.search.FindMethods:
      methodPattern: "org.springframework.security.core.context.SecurityContext setAuthentication(..)"
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.security.FindSpaCsrfMigrationGap
displayName: "SPA CSRF 토큰 지연 로딩 및 BREACH 보호 전환 검토 후보 탐지"
description: "Security 6 은 CSRF 토큰 지연 로딩과 BREACH 보호를 기본 적용한다. CookieCsrfTokenRepository 를 사용하는 SPA 의 토큰 발급 및 request handler 를 확인한다. 최초 요청, 로그인 직후, 로그아웃 후 POST 를 테스트한다. 쿠키 사용만으로 결함을 단정하거나 CSRF 를 비활성화하지 않는다."
recipeList:
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: "org.springframework.security.web.csrf.CookieCsrfTokenRepository"
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.cache.FindAsyncCacheConfigurationGap
displayName: "비동기 반환값의 캐시 의미 및 provider 지원 변경 검토 후보 탐지"
description: "Framework 6.1 부터 CompletableFuture/Mono 의 완료 값과 Flux 가 완료되어 수집된 List 를 캐시한다. CaffeineCacheManager 의 asyncCacheMode 와 provider 의 비동기 조회 지원을 확인한다. 캐시 적중 시 호출 횟수, 오류 및 스트림 완료를 테스트한다. 검색은 같은 파일의 캐시 어노테이션과 비동기 타입 조합을 후보로 표시한다."
preconditions:
  - org.openrewrite.java.search.FindAnnotations:
      annotationPattern: "@org.springframework.cache.annotation.Cache*"
recipeList:
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: "reactor.core.publisher.Mono"
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: "reactor.core.publisher.Flux"
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: "java.util.concurrent.CompletableFuture"
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.spring.FindTransactionalEventListenerConfiguration
displayName: "트랜잭션 이벤트 리스너의 propagation 검증 강화 검토 후보 탐지"
description: "Framework 6.1 부터 TransactionalEventListener 에 부적절한 Transactional 을 함께 선언하면 기동이 거부될 수 있다. 메서드 및 클래스 수준 propagation, Async, 이벤트 phase 를 확인한다. REQUIRES_NEW 일괄 치환은 트랜잭션 경계와 커넥션 사용을 바꾸므로 하지 않는다. commit/rollback 별 저장 결과를 테스트한다."
preconditions:
  - org.openrewrite.java.search.FindAnnotations:
      annotationPattern: "@org.springframework.transaction.annotation.Transactional"
recipeList:
  - org.openrewrite.java.search.FindAnnotations:
      annotationPattern: "@org.springframework.transaction.event.TransactionalEventListener"
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.spring.FindLateConditionalComponentScan
displayName: "빈 등록 단계 조건과 ComponentScan 조합의 기동 실패 검토 후보 탐지"
description: "Framework 6.2 는 ComponentScan 과 REGISTER_BEAN 단계 조건의 조합을 거부한다. ConditionalOnBean/ConditionalOnMissingBean 과 같은 파일의 스캔을 검토 후보로 표시한다. 합성 어노테이션이나 다른 파일의 상위 설정에 숨은 조건은 추가 검토한다. 조건부 설정을 분리하거나 명시적 Import 로 전환하되 스캔 범위를 임의 변경하지 않는다."
preconditions:
  - org.openrewrite.java.search.FindAnnotations:
      annotationPattern: "@org.springframework.boot.autoconfigure.condition.ConditionalOn*Bean"
recipeList:
  - org.openrewrite.java.search.FindAnnotations:
      annotationPattern: "@org.springframework.context.annotation.ComponentScan"
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.httpclient.FindHttpHeadersMapUsage
displayName: "HttpHeaders 의 MultiValueMap 계약 제거 검토 후보 탐지"
description: "Framework 7 의 HttpHeaders 는 MultiValueMap 을 구현하지 않는다. 같은 파일에서 두 타입을 사용하는 코드를 후보로 표시한다. 대입, 반환, 외부 API 전달을 검토하고 HTTP 헤더의 대소문자 무시 의미를 보존한다. 쿼리/폼 데이터와 헤더를 구분하며 deprecated asMultiValueMap 으로 일괄 우회하지 않는다."
preconditions:
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: "org.springframework.util.MultiValueMap"
recipeList:
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: "org.springframework.http.HttpHeaders"
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.testing.FindTestListenerClassScopeAssumption
displayName: "중첩 테스트와 TestExecutionListener 클래스 범위 변경 검토 후보 탐지"
description: "Framework 7 의 SpringExtension 은 test-method 범위 ExtensionContext 를 사용한다. 커스텀 TestExecutionListener.prepareTestInstance 에서 getTestClass 를 쓰는 경우 실제 인스턴스 클래스가 필요한지 확인한다. 필요한 곳만 getTestInstance().getClass() 로 바꾸고 최상위/Nested 테스트를 검증한다. 검색은 TestExecutionListener 타입과 getTestClass 호출이 같은 파일에 있는 후보를 표시한다."
preconditions:
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: "org.springframework.test.context.TestExecutionListener"
recipeList:
  - org.openrewrite.java.search.FindMethods:
      methodPattern: "org.springframework.test.context.TestContext getTestClass()"
