# opensearch-java: Boot BOM 이 관리하지 않아서 직접 올린다
#  3.x 는 opensearch-rest-client 3.x (HttpClient 5 기반) 와 짝이다. upstream UpgradeApacheHttpClient_5 (3.0 체인) 의
#  HttpClient 5 전환과 방향이 같으므로 3.0 단계에서 함께 올린다. OpenSearch 서버 버전 호환은 dev 에서 확인한다.
# ---------------------------------------------------------------------------------------------------------------------
---
type: specs.openrewrite.org/v1beta/recipe
