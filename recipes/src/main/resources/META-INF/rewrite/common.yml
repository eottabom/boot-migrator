  - com.eottabom.rewrite.httpclient.FixHttpClient5AsyncInterceptors

# ---------------------------------------------------------------------------------------------------------------------
# elasticsearch-java 9 (Boot 4.0 BOM)
#  3.x 동안은 RevertHttpClient5ForElasticsearchRestClient 로 HttpClient 4 기반 RestClient 를 유지하고,
#  4.0 에서 elasticsearch-java 9 의 HttpClient 5 기반 Rest5Client 로 옮긴다.
# ---------------------------------------------------------------------------------------------------------------------
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.elasticsearch.MigrateToRest5Client
displayName: Elasticsearch RestClient -> Rest5Client (HttpClient 5)
description: >-
  org.elasticsearch.client.RestClient 를 쓰는 파일을 elasticsearch-java 9 의 Rest5Client / Rest5ClientTransport 로 바꾼다.
  HttpClient 4 코드는 upstream UpgradeApacheHttpClient_5 가 HttpClient 5 로 바꾸고, 남는 API 차이를 커스텀 레시피가 맞춘다.
preconditions:
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: org.elasticsearch.client.RestClient
recipeList:
  - org.openrewrite.apache.httpclient5.UpgradeApacheHttpClient_5
  # 원래 타입(RestClientBuilder)으로 판단해야 하므로 ChangeType 보다 먼저
  - com.eottabom.rewrite.elasticsearch.Rest5ClientCallbacksToConsumer
  - com.eottabom.rewrite.httpclient.FixHttpClient5AsyncInterceptors
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.elasticsearch.client.RestClient
      newFullyQualifiedTypeName: co.elastic.clients.transport.rest5_client.low_level.Rest5Client
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.elasticsearch.client.RestClientBuilder
      newFullyQualifiedTypeName: co.elastic.clients.transport.rest5_client.low_level.Rest5ClientBuilder
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.elasticsearch.client.Request
      newFullyQualifiedTypeName: co.elastic.clients.transport.rest5_client.low_level.Request
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.elasticsearch.client.Response
      newFullyQualifiedTypeName: co.elastic.clients.transport.rest5_client.low_level.Response
  - org.openrewrite.java.ChangeType:
