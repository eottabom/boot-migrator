# =====================================================================================================================
# 공통 빌딩 블록
#  - 각 Spring Boot 단계 레시피(spring-boot.yml)에서 조합해서 사용한다.
#  - 모두 멱등(idempotent)하게 작성한다. 이미 목표 버전 이상이면 아무 변경도 하지 않는다.
# =====================================================================================================================

# ---------------------------------------------------------------------------------------------------------------------
# 공통 마이그레이션 보정: 모든 단계의 마지막에 매번 실행
# ---------------------------------------------------------------------------------------------------------------------
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.CommonMigrationFixes
displayName: 공통 마이그레이션 보정
description: >-
  JDK 호환성이 버전에 강하게 묶인 라이브러리(Lombok)를 올린다.
  각 단계 레시피의 마지막에 실행된다.
  주의) org.openrewrite.gradle.RemoveRedundantDependencyVersions 는 groupPattern 을 줘도 "transitive 로 충족되는 direct 의존성" 까지
  삭제한다(ex. spring-boot-starter-cache, querydsl-core, testAnnotationProcessor lombok). 절대 사용하지 않는다.
recipeList:
  # Lombok 은 JDK 버전에 강하게 묶여 있다 (Java 21 은 1.18.30+ 필요)
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.projectlombok
      artifactId: lombok
      newVersion: 1.18.x
  # Lombok 1.18.40+ 는 @JsonProperty 를 getter 에 복사하지 않아 `@JsonProperty("isShow") boolean isShow` 가 JSON 에 isShow, show 로
  # 두 번 나간다. lombok.config 로 이전 동작 유지 (Lombok + Jackson 어노테이션을 쓰는 프로젝트만)
  - com.eottabom.rewrite.lombok.CopyJacksonAnnotationsToAccessors
  - com.eottabom.rewrite.gradle.DeclareUsedTransitiveDependencies
  - com.eottabom.rewrite.java.UnshadeRelocatedImports
  # Hypersistence JSON 속성 객체: Serializable 이 아니면 저장/수정 시 NonSerializableObjectException,
  # List/Map 원소에 equals 가 없으면 트랜잭션마다 유령 UPDATE
  - com.eottabom.rewrite.hibernate.FixHypersistenceJsonAttributes
  # upstream 이 HikariConfig 빈에 @DependsOnDatabaseInitialization 을 붙여 DB 초기화 빈과 순환 참조가 생기는 문제
  - com.eottabom.rewrite.spring.RemoveDependsOnDatabaseInitializationFromDataSourceConfig
  # Kafka 는 Boot BOM 이 clients / streams / test-utils 를 같은 버전으로 관리한다.
  # 하나라도 버전을 박아두면 Boot 업그레이드 후 섞여서 NoSuchMethodError 가 난다 (ex. kafka-streams-test-utils:3.9.0 + Kafka 4.x)
  - com.eottabom.rewrite.gradle.RemoveDependencyVersion:
      groupId: org.apache.kafka
  - com.eottabom.rewrite.aws.UnpinAwsSdkVersions
  # Hibernate 버그 수정(HHH-17294, HHH-18378 등)은 패치 릴리즈로 나온다. 버전을 박아두면 Boot 를 올려도 수정이 반영되지 않는다
  - com.eottabom.rewrite.gradle.RemoveDependencyVersion:
      groupId: org.hibernate.orm
  # Boot 모듈은 BOM 이 관리한다. upstream 이 추가하며 박은 버전(ex. spring-boot-starter-jdbc-test:4.0.8)이 남으면 다음 단계에서 어긋난다
  - com.eottabom.rewrite.gradle.RemoveDependencyVersion:
      groupId: org.springframework.boot
  # upstream 이 같은 실행 안에서 여러 번 jaxb-api 를 추가할 수 있어서 매 단계 마지막에 정리한다
  - com.eottabom.rewrite.spring.RemoveSpuriousJaxbApi
  # upstream 의존성 레시피가 중첩 빌드의 settings 스크립트에 dependencies 블록을 넣는 문제 보정 (의존성 레시피들 뒤에 둔다)
  - com.eottabom.rewrite.gradle.RemoveDependenciesFromSettingsScript
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.gradle.DeclareUsedTransitiveDependencies
displayName: transitive 로만 들어오던 의존성 직접 선언
description: >-
  코드에서 import 하는데 build.gradle 에 선언이 없는 것들. Boot / Spring Cloud 를 올리며 의존성 그래프가 바뀌면 사라져 컴파일이 깨진다.
  새 라이브러리가 필요하면 여기 한 줄씩 추가한다.
  packageName 에 쉼표로 적은 두 번째 이후 패키지는 "같은 실행 안에서 upstream 이 첫 번째 패키지로 바꾸는 것" 이다.
  (스캔은 편집 전 원본 기준이라, 바뀌기 전 패키지도 알아야 한다)
recipeList:
  # commons-lang 2 는 upstream UpgradeApacheCommonsLang_2_3 이 lang3 로 패키지를 바꾼다 (의존성은 추가하지 않음)
  # logstash-logback-encoder 6.x 처럼 lang3 클래스를 jar 에 번들한 라이브러리 덕에 컴파일되던 경우도 여기서 잡힌다
  - com.eottabom.rewrite.gradle.DeclareUsedDependency:
      packageName: org.apache.commons.lang3, org.apache.commons.lang, org.testcontainers.shaded.org.apache.commons.lang3, net.logstash.logback.encoder.org.apache.commons.lang3
      groupId: org.apache.commons
      artifactId: commons-lang3
  - com.eottabom.rewrite.gradle.DeclareUsedDependency:
      packageName: org.apache.commons.io, org.testcontainers.shaded.org.apache.commons.io, net.logstash.logback.encoder.org.apache.commons.io
      groupId: commons-io
      artifactId: commons-io
      version: 2.x
  - com.eottabom.rewrite.gradle.DeclareUsedDependency:
      packageName: org.apache.commons.collections4
      groupId: org.apache.commons
      artifactId: commons-collections4
      version: 4.x
  # Guava 는 BOM 이 관리하지 않아 버전이 필요하다. 버전은 "33.4.8-jre" 형식이라 -jre 패턴을 준다
  - com.eottabom.rewrite.gradle.DeclareUsedDependency:
      packageName: com.google.common
      groupId: com.google.guava
      artifactId: guava
      version: 33.x
      versionPattern: -jre
  # Boot 4 에서 TestRestTemplate(spring-boot-resttestclient) 은 RestTemplateBuilder(spring-boot-restclient) 를 가져오지 않는다.
  # 이미 Boot 4 인 프로젝트도 다음 단계에서 맞춰지도록 공통 보정에 둔다. 두 패키지는 Boot 4 에만 있어서 3.x 단계에는 영향이 없다
  - com.eottabom.rewrite.gradle.DeclareUsedDependency:
      packageName: org.springframework.boot.restclient, org.springframework.boot.resttestclient
      groupId: org.springframework.boot
      artifactId: spring-boot-restclient
  # org.aspectj 는 넣지 않는다: Boot 3 은 spring-boot-starter-aop, Boot 4 는 spring-boot-starter-aspectj 로 artifact 가 달라서
  # 공통 보정에서 추가하면 Boot 4 단계에서 없는 artifact 를 다시 넣게 된다 (upstream 이 이름을 바꿔준다)

---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.java.UnshadeRelocatedImports
displayName: 라이브러리 내부에 relocate 된 패키지 import 를 원래 라이브러리로
description: >-
  org.testcontainers.shaded.* (Testcontainers 2 에서 제거), net.logstash.logback.encoder.org.apache.* (logstash-logback-encoder 7+ 에서 제거) 는
  라이브러리 내부용 복사본이라 버전을 올리면 사라진다. 원래 라이브러리 패키지로 바꾸고, 의존성 선언은 DeclareUsedTransitiveDependencies 가 한다.
recipeList:
  - org.openrewrite.java.ChangePackage:
      oldPackageName: net.logstash.logback.encoder.org.apache.commons.lang3
      newPackageName: org.apache.commons.lang3
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: net.logstash.logback.encoder.org.apache.commons.io
      newPackageName: org.apache.commons.io
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.testcontainers.shaded.org.apache.commons.io
      newPackageName: org.apache.commons.io
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.testcontainers.shaded.org.apache.commons.lang3
      newPackageName: org.apache.commons.lang3
      recursive: true

---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.hibernate.KeepLegacyIdGeneratorNaming
displayName: Hibernate 6 ID 시퀀스 이름을 Hibernate 5 방식으로 유지
description: >-
  Hibernate 6 는 @GeneratedValue(AUTO/SEQUENCE) 의 시퀀스를 엔티티별 `<entity>_SEQ` 로 찾는다. Hibernate 5 에서 쓰던
  `hibernate_sequence` 를 그대로 쓰도록 legacy 전략을 설정한다. (운영 DB 에서 시퀀스/테이블을 못 찾는 문제 방지)
  Boot 2.x 에서 올라오는 모듈에만 적용한다. 이미 Boot 3 인 모듈은 현재 동작을 바꾸지 않는다.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.springframework.boot
      artifactIdPattern: spring-boot
      version: "[2.0,3.0)"
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.hibernate*
      artifactIdPattern: hibernate-core
recipeList:
  - org.openrewrite.java.spring.AddSpringProperty:
      property: spring.jpa.properties.hibernate.id.db_structure_naming_strategy
      value: legacy
      comment: "Hibernate 6: Hibernate 5 의 hibernate_sequence 를 그대로 사용 (Boot 3 마이그레이션 시 추가)"
      pathExpressions:
        - "**/src/main/resources/application.yml"
        - "**/src/main/resources/application.yaml"
        - "**/src/main/resources/application.properties"

---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.hibernate.MigrateWhereToSQLRestriction
displayName: "@Where / @WhereJoinTable -> @SQLRestriction / @SQLJoinTableRestriction"
description: >-
  Hibernate 6.3 에서 deprecated, Hibernate 7 (Boot 4) 에서 제거. 대체 어노테이션은 6.3 부터 있으므로 Boot 3.2 (Hibernate 6.4) 단계에서 미리 바꾼다.
recipeList:
  - org.openrewrite.java.ChangeAnnotationAttributeName:
      annotationType: org.hibernate.annotations.Where
      oldAttributeName: clause
      newAttributeName: value
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.hibernate.annotations.Where
      newFullyQualifiedTypeName: org.hibernate.annotations.SQLRestriction
  - org.openrewrite.java.ChangeAnnotationAttributeName:
      annotationType: org.hibernate.annotations.WhereJoinTable
      oldAttributeName: clause
      newAttributeName: value
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.hibernate.annotations.WhereJoinTable
      newFullyQualifiedTypeName: org.hibernate.annotations.SQLJoinTableRestriction
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.hibernate.ReplaceAnnotationsQueryHints
displayName: org.hibernate.annotations.QueryHints -> HibernateHints
description: >-
  Hibernate 7 에서 제거된 org.hibernate.annotations.QueryHints 상수를 같은 값의 org.hibernate.jpa.HibernateHints / SpecHints 상수로 바꾼다.
  TIMEOUT_JPA 의 javax 키는 jakarta 키로 바뀐다 (Hibernate 7 은 javax 키를 읽지 않는다).
recipeList:
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.hibernate.annotations.QueryHints.READ_ONLY
      fullyQualifiedConstantName: org.hibernate.jpa.HibernateHints.HINT_READ_ONLY
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.hibernate.annotations.QueryHints.CACHEABLE
      fullyQualifiedConstantName: org.hibernate.jpa.HibernateHints.HINT_CACHEABLE
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.hibernate.annotations.QueryHints.CACHE_MODE
      fullyQualifiedConstantName: org.hibernate.jpa.HibernateHints.HINT_CACHE_MODE
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.hibernate.annotations.QueryHints.CACHE_REGION
      fullyQualifiedConstantName: org.hibernate.jpa.HibernateHints.HINT_CACHE_REGION
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.hibernate.annotations.QueryHints.COMMENT
      fullyQualifiedConstantName: org.hibernate.jpa.HibernateHints.HINT_COMMENT
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.hibernate.annotations.QueryHints.FETCH_SIZE
      fullyQualifiedConstantName: org.hibernate.jpa.HibernateHints.HINT_FETCH_SIZE
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.hibernate.annotations.QueryHints.FLUSH_MODE
      fullyQualifiedConstantName: org.hibernate.jpa.HibernateHints.HINT_FLUSH_MODE
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.hibernate.annotations.QueryHints.TIMEOUT_HIBERNATE
      fullyQualifiedConstantName: org.hibernate.jpa.HibernateHints.HINT_TIMEOUT
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.hibernate.annotations.QueryHints.NATIVE_LOCKMODE
      fullyQualifiedConstantName: org.hibernate.jpa.HibernateHints.HINT_NATIVE_LOCK_MODE
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.hibernate.annotations.QueryHints.FOLLOW_ON_LOCKING
      fullyQualifiedConstantName: org.hibernate.jpa.HibernateHints.HINT_FOLLOW_ON_LOCKING
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.hibernate.annotations.QueryHints.NATIVE_SPACES
      fullyQualifiedConstantName: org.hibernate.jpa.HibernateHints.HINT_NATIVE_SPACES
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.hibernate.annotations.QueryHints.CALLABLE_FUNCTION
      fullyQualifiedConstantName: org.hibernate.jpa.HibernateHints.HINT_CALLABLE_FUNCTION
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.hibernate.annotations.QueryHints.TIMEOUT_JAKARTA_JPA
      fullyQualifiedConstantName: org.hibernate.jpa.SpecHints.HINT_SPEC_QUERY_TIMEOUT
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.hibernate.annotations.QueryHints.TIMEOUT_JPA
      fullyQualifiedConstantName: org.hibernate.jpa.SpecHints.HINT_SPEC_QUERY_TIMEOUT
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.spring.Boot4JpaRelocations
displayName: Boot 4 JPA 관련 클래스 패키지 이동 보정
description: >-
  Boot 4 모듈 분리로 JPA 관련 클래스가 spring-boot-jpa / spring-boot-hibernate 모듈로 옮겨졌다.
  upstream 은 JpaProperties 를 hibernate.autoconfigure 로 잘못 옮기고, EntityManagerFactoryBuilder 는 옮기지 않는다.
  (spring-boot-jpa-4.0.x.jar / spring-boot-hibernate-4.0.x.jar 의 실제 클래스 위치 기준)
recipeList:
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.hibernate.autoconfigure.JpaProperties
      newFullyQualifiedTypeName: org.springframework.boot.jpa.autoconfigure.JpaProperties
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.autoconfigure.orm.jpa.JpaProperties
      newFullyQualifiedTypeName: org.springframework.boot.jpa.autoconfigure.JpaProperties
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.autoconfigure.orm.jpa.HibernateProperties
      newFullyQualifiedTypeName: org.springframework.boot.hibernate.autoconfigure.HibernateProperties
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.autoconfigure.orm.jpa.HibernateSettings
      newFullyQualifiedTypeName: org.springframework.boot.hibernate.autoconfigure.HibernateSettings
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.orm.jpa.EntityManagerFactoryBuilder
      newFullyQualifiedTypeName: org.springframework.boot.jpa.EntityManagerFactoryBuilder
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.spring.Boot4TestStartersForMainSources
displayName: Boot 4 테스트 자동 구성 starter (main 소스셋 포함)
description: >-
  upstream MigrateToModularStarters 는 테스트 자동 구성(@DataJpaTest 등) 사용처에 test starter 를 testImplementation 으로만 추가한다.
  테스트 공용 코드를 src/main 에 둔 모듈(testFixtures 대신 별도 모듈)은 빠지므로, 같은 starter 를 쓰는 소스셋에 맞춰 선언한다.
  패키지 조건은 upstream 과 같다. 버전은 Boot BOM 이 관리한다.
recipeList:
  # 스캔은 원본 기준이라 Boot 3 패키지로 판단한다 (Boot 4 패키지는 재실행 시를 위해 같이 적는다)
  - com.eottabom.rewrite.gradle.DeclareUsedDependency:
      packageName: org.springframework.boot.test.autoconfigure.orm.jpa, org.springframework.boot.data.jpa.test.autoconfigure
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-data-jpa-test
  - com.eottabom.rewrite.gradle.DeclareUsedDependency:
      packageName: org.springframework.boot.test.autoconfigure.jdbc, org.springframework.boot.jdbc.test.autoconfigure
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-jdbc-test
  - com.eottabom.rewrite.gradle.DeclareUsedDependency:
      packageName: org.springframework.boot.test.autoconfigure.web.servlet, org.springframework.boot.webmvc.test.autoconfigure
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-webmvc-test
  - com.eottabom.rewrite.gradle.DeclareUsedDependency:
      packageName: org.springframework.boot.test.autoconfigure.web.client
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-restclient-test
  - com.eottabom.rewrite.gradle.DeclareUsedDependency:
      packageName: org.springframework.boot.test.web.client
      groupId: org.springframework.boot
      artifactId: spring-boot-resttestclient
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.spring.Boot4RestDocsModule
displayName: Boot 4 REST Docs 테스트 자동 구성 모듈 분리 대응
description: >-
  Boot 4 에서 @AutoConfigureRestDocs 등이 spring-boot-restdocs 모듈의
  org.springframework.boot.restdocs.test.autoconfigure 패키지로 옮겨졌다. upstream 은 REST Docs 를 처리하지 않는다.
  패키지를 옮기고, 쓰는 소스셋에 spring-boot-restdocs 의존성을 선언한다.
recipeList:
  # 스캔은 원본 기준이라 이동 전 패키지로 판단한다
  - com.eottabom.rewrite.gradle.DeclareUsedDependency:
      packageName: org.springframework.boot.test.autoconfigure.restdocs, org.springframework.boot.restdocs.test.autoconfigure
      groupId: org.springframework.boot
      artifactId: spring-boot-restdocs
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.springframework.boot.test.autoconfigure.restdocs
      newPackageName: org.springframework.boot.restdocs.test.autoconfigure

# ---------------------------------------------------------------------------------------------------------------------
# Spring Cloud AWS
#  Boot 3.0/3.1 -> 3.0.x | 3.2 -> 3.1.x | 3.3 -> 3.2.x | 3.4 -> 3.3.x | 3.5 -> 3.4.x | 4.0 -> 4.0.x | 4.1 -> 4.1.x
#  mavenBom "io.awspring.cloud:spring-cloud-aws-dependencies:${springCloudAwsVersion}" 형태의 ext 변수도 함께 올라간다.
#  (upstream rewrite-spring 에는 Spring Cloud AWS 레시피가 없어서 직접 정의)
# ---------------------------------------------------------------------------------------------------------------------
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.aws.UnpinAwsSdkVersions
displayName: AWS SDK 고정 버전 제거 (Spring Cloud AWS BOM 에 맡김)
description: >-
  Spring Cloud AWS BOM 은 AWS SDK BOM 을 import 한다. software.amazon.awssdk:s3:2.21.12 처럼 일부만 버전을 박아두면
  Spring Cloud AWS 를 올릴 때 sdk-core 만 올라가 IncompatibleClassChangeError (overrides final method setOverrides) 가 난다.
  Spring Cloud AWS 를 쓰는 모듈에서만 버전을 지운다. (BOM 좌표 platform("...:bom:x") 는 유지)
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: io.awspring.cloud
      artifactIdPattern: "*"
recipeList:
  - com.eottabom.rewrite.gradle.RemoveDependencyVersion:
      groupId: software.amazon.awssdk
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.aws.MigrateSpringCloudAws_2_to_3
displayName: Spring Cloud AWS 2.x -> 3.0 (artifact 이름 변경)
description: >-
  Spring Cloud AWS 3.0 에서 바뀐 starter artifact 이름으로 교체한다. (Boot 2.7 -> 3.0 전환 시 필요)
  SQS/SNS messaging 은 API 자체가 바뀌므로 artifact 교체 후 코드 수정이 필요하다.
recipeList:
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: io.awspring.cloud
