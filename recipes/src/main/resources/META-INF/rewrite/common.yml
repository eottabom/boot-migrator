type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.logging.FixLogstashDecoratorForJackson3
displayName: logstash JsonGeneratorDecorator 의 ObjectMapper 변경 코드 제거 (Jackson 3)
description: >-
  Jackson 2 시절 decorator 안에서 `(ObjectMapper) generator.getCodec()` 을 꺼내 feature 를 켜던 코드.
  Jackson 3 의 ObjectMapper 는 불변이라 enable/disable/configure 가 없고, upstream 이 바꾼
  `(ObjectMapper) generator.objectWriteContext()` 는 런타임에 ClassCastException 이 난다.
  decorator 안의 해당 호출과, 그래서 안 쓰이게 된 ObjectMapper 지역 변수를 함께 제거한다.
  generator 에 역직렬화 feature 를 켜던 코드라 원래도 출력에는 효과가 없었다. 필요하면 logstash encoder 의 jsonFactory 설정으로 옮긴다.
preconditions:
  - org.openrewrite.java.search.FindImplementations:
      typeName: net.logstash.logback.decorate.JsonGeneratorDecorator
recipeList:
  - org.openrewrite.java.RemoveMethodInvocations:
      methodPattern: "*..ObjectMapper enable(..)"
  - org.openrewrite.java.RemoveMethodInvocations:
      methodPattern: "*..ObjectMapper disable(..)"
  - org.openrewrite.java.RemoveMethodInvocations:
      methodPattern: "*..ObjectMapper configure(..)"
  - org.openrewrite.staticanalysis.RemoveUnusedLocalVariables:
      withType: tools.jackson.databind.ObjectMapper
      withSideEffects: true
  - org.openrewrite.staticanalysis.RemoveUnusedLocalVariables:
      withType: com.fasterxml.jackson.databind.ObjectMapper
      withSideEffects: true
  - org.openrewrite.java.RemoveUnusedImports
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.logging.UpgradeLogstashEncoder_9
displayName: logstash-logback-encoder 9.x
description: Jackson 3 (Spring Boot 4.0) 기반 버전으로 업그레이드
recipeList:
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: net.logstash.logback
      artifactId: logstash-logback-encoder
      newVersion: 9.x

# ---------------------------------------------------------------------------------------------------------------------
# Gradle 빌드 도구 / 플러그인
#  Boot 3.4+ 는 Gradle 7.6.4+ / 8.4+, Boot 4.0 은 8.14+ 가 필요하다 (playbook/compatibility.yml).
#  러너는 현재 Gradle 이 목표 Boot 지원 범위 밖일 때만 이 레시피를 별도 단계로 실행한다.
#  Gradle 8.14 에서 동작하지 않는 구버전 서드파티 플러그인도 함께 올린다.
# ---------------------------------------------------------------------------------------------------------------------
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.gradle.UpgradeGradleToolchain_8_14
displayName: Gradle 8.14 및 서드파티 플러그인 정렬
description: Gradle wrapper 를 8.14.x 로 올리고, 이에 맞춰 freefair lombok / asciidoctor 플러그인을 올린다.
recipeList:
  - org.openrewrite.gradle.UpdateGradleWrapper:
      version: 8.14.x
      addIfMissing: false
  # freefair 플러그인은 major 버전이 Gradle major 버전을 따라간다 (6.x = Gradle 7, 8.x = Gradle 8)
  - org.openrewrite.gradle.plugins.UpgradePluginVersion:
      pluginIdPattern: io.freefair.*
      newVersion: 8.x
  - org.openrewrite.gradle.plugins.UpgradePluginVersion:
      pluginIdPattern: org.asciidoctor.jvm.*
      newVersion: 4.0.x
  - org.openrewrite.gradle.plugins.UpgradePluginVersion:
      pluginIdPattern: com.gorylenko.gradle-git-properties
      newVersion: 2.5.x
  - com.eottabom.rewrite.gradle.catalog.VersionCatalog_Gradle8_14

