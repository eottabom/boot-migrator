# =====================================================================================================================
# Spring Boot 단계별 마이그레이션
#
#   com.eottabom.rewrite.spring.MigrateToSpringBoot_3_0   (2.7 -> 3.0 : javax -> jakarta, Hibernate 6, Cloud 2022, AWS 3.0)
#   com.eottabom.rewrite.spring.MigrateToSpringBoot_3_1
#   com.eottabom.rewrite.spring.MigrateToSpringBoot_3_2   (Cloud 2023.0, AWS 3.1)
#   com.eottabom.rewrite.spring.MigrateToSpringBoot_3_3   (AWS 3.2, logstash 8)
#   com.eottabom.rewrite.spring.MigrateToSpringBoot_3_4   (Cloud 2024.0, AWS 3.3, Gradle 8.14)
#   com.eottabom.rewrite.spring.MigrateToSpringBoot_3_5   (Cloud 2025.0, AWS 3.4)
#   com.eottabom.rewrite.spring.MigrateToSpringBoot_4_0   (Cloud 2025.1, AWS 4.0, Framework 7, Hibernate 7.1, Testcontainers 2)
#   com.eottabom.rewrite.spring.MigrateToSpringBoot_4_1   (AWS 4.1, 4.1 프로퍼티 변경)
#
# 단계마다 두 레시피가 있다.
#   SpringBootStep_X_Y      이 단계의 변경만: upstream 단계 레시피(직전 단계 체인 제외) + 이 단계의 커스텀 보정.
#                           러너(migrationRun)가 현재 버전의 다음 단계부터 하나씩 실행한다. 이미 지난 단계(예: Boot 2.x 의
#                           best practice 레시피)는 다시 돌지 않는다. 3.0 은 2.x 에서 올라오는 입구라 upstream 전체 체인을 쓴다.
#   MigrateToSpringBoot_X_Y 직전 MigrateToSpringBoot + SpringBootStep_X_Y. 어떤 버전에서 시작하든 하나로 목표까지 간다
#                           (--one-shot, 레시피 단독 실행). Singleton precondition 으로 중복 실행은 방지된다.
# upstream 이 큰 틀을 맡고, 커스텀 보정은 upstream 만으로 컴파일/테스트가 깨지거나 수동으로 고쳐야 하는 틈을 메운다.
#
# 모든 단계에 spring-boot-properties-migrator(runtimeOnly) 가 추가된다.
# 배포 환경 기동 로그의 WARN 을 확인해 외부 설정 저장소의 키를 정리한 뒤 의존성을 제거한다.
# =====================================================================================================================
# 러너가 단계별로 실행하는 레시피. upstream UpgradeSpringBoot_3_0 전체 체인(2.x -> 3.0)을 쓴다
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.spring.SpringBootStep_3_0
displayName: "Spring Boot 3.0 단계 (이 단계의 변경만)"
description: Spring Boot 2.7 -> 3.0. javax -> jakarta, Hibernate 6.1, Spring Cloud 2022.0, Spring Cloud AWS 3.0.
preconditions:
  - org.openrewrite.Singleton
recipeList:
  # "2.x 에서 올라오는지" 를 원본 의존성으로 판단해야 해서 upstream 보다 먼저 둔다
  - com.eottabom.rewrite.hibernate.KeepLegacyIdGeneratorNaming
  - org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_0
  # upstream UpgradeApacheHttpClient_5 가 Elasticsearch 저수준 RestClient(HttpClient 4 기반) 코드까지 HttpClient 5 로 바꾸는 것을 되돌린다.
  # elasticsearch-java 8.x (Boot 3.x BOM) 의 RestClient 는 HttpClient 4 를 쓴다. 아래 인터셉터 보정보다 먼저 되돌려야 ES 코드가 HttpClient 5 형태로 바뀌지 않는다
  - com.eottabom.rewrite.httpclient.RevertHttpClient5ForElasticsearchRestClient
  # opensearch-java / rest-client 3.x (HttpClient 5). upstream UpgradeApacheHttpClient_5 (위 체인 안) 와 같은 단계에서 맞춘다
  - com.eottabom.rewrite.search.UpgradeOpenSearchJava_3
  # upstream UpgradeSpringBoot_3_0 이 BOM 관리 중이던 restdocs 에 2.0.6.RELEASE 를 명시 고정하는 문제 보정
  - com.eottabom.rewrite.spring.UnpinSpringRestDocs
  - com.eottabom.rewrite.aws.MigrateSpringCloudAws_2_to_3
  - com.eottabom.rewrite.querydsl.MigrateQuerydslToJakarta
  - com.eottabom.rewrite.logging.UpgradeLogstashEncoder_7
  - com.eottabom.rewrite.spring.Boot3Extras
  # Boot 3.0 은 Mockito 4 라서 final/static mock 에 mockito-inline 이 아직 필요하다. 구버전 고정만 4.x 로 맞춘다 (제거는 3.1)
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.mockito
      artifactId: mockito-inline
      newVersion: 4.x
  # 외부 설정 저장소의 설정 키 변경을 기동 로그로 확인하기 위해 임시 추가 (검증 후 제거)
  - com.eottabom.rewrite.spring.AddPropertiesMigrator
  # upstream 버전 변경을 gradle/libs.versions.toml 에도 적용 (version-catalog-steps.yml, 생성 파일)
  - com.eottabom.rewrite.gradle.catalog.VersionCatalog_3_0
  - com.eottabom.rewrite.CommonMigrationFixes
---
# 직전 단계까지 체이닝한 전체 레시피 (--one-shot, 단독 실행용)
