type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.spring.SpringBootStep_3_4
displayName: "Spring Boot 3.4 단계 (이 단계의 변경만)"
description: Spring Boot 3.3 -> 3.4. Spring Cloud 2024.0, Spring Cloud AWS 3.3.
