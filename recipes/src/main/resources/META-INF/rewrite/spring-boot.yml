  - com.eottabom.rewrite.spring.SpringBootStep_3_0
---
# 러너가 단계별로 실행하는 레시피. upstream 은 직전 단계 체인을 뺀 UpgradeSpringBootStep_3_1 (upstream-spring-boot-steps.yml)
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.spring.SpringBootStep_3_1
displayName: "Spring Boot 3.1 단계 (이 단계의 변경만)"
description: Spring Boot 3.0 -> 3.1. Hibernate 6.2, Mockito 5.
preconditions:
  - org.openrewrite.Singleton
recipeList:
  - com.eottabom.rewrite.spring.upstream.UpgradeSpringBootStep_3_1
  # Mockito 5 부터 inline mock maker 가 기본값이라 mockito-inline 은 불필요
  - org.openrewrite.java.dependencies.RemoveDependency:
      groupId: org.mockito
      artifactId: mockito-inline
  - com.eottabom.rewrite.aws.UpgradeSpringCloudAws_3_0
  # 이 단계의 설정 키 변경을 기동 로그로 확인하기 위해 (이미 있으면 그대로)
  - com.eottabom.rewrite.spring.AddPropertiesMigrator
  # upstream 버전 변경을 gradle/libs.versions.toml 에도 적용 (version-catalog-steps.yml, 생성 파일)
  - com.eottabom.rewrite.gradle.catalog.VersionCatalog_3_1
  - com.eottabom.rewrite.CommonMigrationFixes
---
