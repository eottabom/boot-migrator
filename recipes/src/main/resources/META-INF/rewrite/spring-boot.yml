# 러너가 단계별로 실행하는 레시피. rewrite-spring 에 UpgradeSpringBoot_4_1 이 없어서 4.1 프로퍼티 변경 + 버전 업그레이드로 직접 구성한다
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.spring.SpringBootStep_4_1
displayName: "Spring Boot 4.1 단계 (이 단계의 변경만)"
description: >-
  Spring Boot 4.0 -> 4.1. rewrite-spring 에 UpgradeSpringBoot_4_1 이 아직 없어서 4.1 프로퍼티 변경 + 버전 업그레이드로 구성한다.
  Spring Cloud 는 2025.1.2 부터 Boot 4.1 을 지원하므로 2025.1.x 최신으로 올린다.
  Spring Cloud 는 기동 시 Boot 버전 호환성을 검사하므로(CompatibilityVerifier) 그보다 낮게 고정돼 있으면 기동이 실패한다.
preconditions:
  - org.openrewrite.Singleton
recipeList:
  - org.openrewrite.java.spring.boot4.SpringBootProperties_4_1
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework.boot
      artifactId: "*"
      newVersion: 4.1.x
      overrideManagedVersion: false
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-dependencies
      newVersion: 4.1.x
      overrideManagedVersion: true
  - org.openrewrite.gradle.plugins.UpgradePluginVersion:
      pluginIdPattern: org.springframework.boot
      newVersion: 4.1.x
  - org.openrewrite.maven.UpgradeParentVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-parent
      newVersion: 4.1.x
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework.cloud
      artifactId: spring-cloud-dependencies
      newVersion: 2025.1.x
  - com.eottabom.rewrite.aws.UpgradeSpringCloudAws_4_1
  # 이 단계의 설정 키 변경을 기동 로그로 확인하기 위해 (이미 있으면 그대로)
  - com.eottabom.rewrite.spring.AddPropertiesMigrator
  # upstream 버전 변경을 gradle/libs.versions.toml 에도 적용 (version-catalog-steps.yml, 생성 파일)
  - com.eottabom.rewrite.gradle.catalog.VersionCatalog_4_1
  - com.eottabom.rewrite.CommonMigrationFixes
---
# 직전 단계까지 체이닝한 전체 레시피 (--one-shot, 단독 실행용)
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.spring.MigrateToSpringBoot_4_1
displayName: "Spring Boot 4.1 마이그레이션"
description: >-
  Spring Boot 4.0 -> 4.1. rewrite-spring 에 UpgradeSpringBoot_4_1 이 아직 없어서 4.1 프로퍼티 변경 + 버전 업그레이드로 구성한다.
  Spring Cloud 는 2025.1.2 부터 Boot 4.1 을 지원하므로 2025.1.x 최신으로 올린다.
  Spring Cloud 는 기동 시 Boot 버전 호환성을 검사하므로(CompatibilityVerifier) 그보다 낮게 고정돼 있으면 기동이 실패한다.
preconditions:
  - org.openrewrite.Singleton
recipeList:
  - com.eottabom.rewrite.spring.MigrateToSpringBoot_4_0
  - com.eottabom.rewrite.spring.SpringBootStep_4_1
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.spring.AddPropertiesMigrator
displayName: "spring-boot-properties-migrator 임시 추가"
description: >-
  OpenRewrite 는 저장소 안의 application*.yml 만 바꿀 수 있고, 외부 설정 저장소(Spring Cloud Config, Vault, Secrets Manager 등) 에 있는 설정은 보지 못한다.
  properties-migrator 는 기동 시 실제로 로딩된 설정 중 이름이 바뀌거나 제거된 키를 WARN 로그로 알려주고 가능한 건 임시로 매핑해준다.
  업그레이드 PR 에 포함해서 개발/스테이징 환경에서 로그를 확인한 뒤, 정리되면 제거한다.
  (@SpringBootApplication 이 있는 모듈에만 추가된다)
recipeList:
  - org.openrewrite.gradle.AddDependency:
      groupId: org.springframework.boot
      artifactId: spring-boot-properties-migrator
      configuration: runtimeOnly
      onlyIfUsing: org.springframework.boot.autoconfigure.SpringBootApplication
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.spring.UnpinSpringRestDocs
displayName: Spring REST Docs 버전을 BOM 관리로 복원
description: spring-restdocs-* 에 명시된 버전을 지워 BOM 관리 버전을 따르게 한다.
recipeList:
  - com.eottabom.rewrite.gradle.RemoveDependencyVersion:
      groupId: org.springframework.restdocs
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.spring.RemoveSpuriousJaxbApi
displayName: 잘못 추가된 javax.xml.bind:jaxb-api 제거
description: >-
  upstream RetainJaxbApiForJackson 은 jackson-module-jaxb-annotations 가 "어느 configuration 에든" 있으면 jaxb-api 를 추가한다.
  init script 로 붙인 `rewrite` configuration(OpenRewrite 자신의 classpath)에 이 모듈이 있어서 모든 프로젝트가 오탐된다.
  javax.xml.bind 타입을 코드에서 직접 쓰지 않으면 runtimeOnly 로 추가된 jaxb-api 를 제거한다.
recipeList:
  - org.openrewrite.java.dependencies.RemoveDependency:
      groupId: javax.xml.bind
      artifactId: jaxb-api
      configuration: runtimeOnly
      unlessUsing: javax.xml.bind..*
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.spring.Boot3Extras
displayName: Boot 3.0 전환 시 upstream 이 빠뜨리는 것들
description: >-
  REST Docs 3 API 변경, Spring Cloud 2022 설정 키 이동, Boot 3 용으로 artifact 이름이 바뀐 라이브러리.
recipeList:
  - com.eottabom.rewrite.spring.UpgradeSpringRestDocs_3
  - com.eottabom.rewrite.spring.SpringCloud2022PropertyKeys
  # Boot 2 용 스타터를 그대로 두면 전이 의존성만 2.x 로 올라가 깨진 조합이 된다
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: io.github.resilience4j
      oldArtifactId: resilience4j-spring-boot2
      newArtifactId: resilience4j-spring-boot3
      newVersion: 2.2.x
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.spring.UpgradeSpringRestDocs_3
displayName: Spring REST Docs 2.0 -> 3.0 API
description: >-
  REST Docs 3.0 에서 requestParameters 가 제거되고 queryParameters / formParameters 로 나뉘었다.
  전부 queryParameters 로 바꾸므로, POST 폼 파라미터를 문서화하는 곳이 있으면 formParameters 로 직접 고친다.
recipeList:
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.springframework.restdocs.request.RequestDocumentation requestParameters(..)
      newMethodName: queryParameters
      matchOverrides: true
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.restdocs.request.RequestParametersSnippet
      newFullyQualifiedTypeName: org.springframework.restdocs.request.QueryParametersSnippet
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.spring.SpringCloud2022PropertyKeys
displayName: Spring Cloud 2022 에서 이동/제거된 설정 키
description: >-
  spring-cloud-openfeign 4.x 는 feign.* 를 spring.cloud.openfeign.* 로 옮겼고, Sleuth 는 Micrometer Tracing 으로 대체됐다.
  upstream 은 artifact 이름만 바꾸고 yml 키는 옮기지 않는다. (저장소 밖 설정은 properties-migrator 로 확인)
recipeList:
  - org.openrewrite.java.spring.ChangeSpringPropertyKey:
      oldPropertyKey: feign.client
      newPropertyKey: spring.cloud.openfeign.client
  - org.openrewrite.java.spring.ChangeSpringPropertyKey:
      oldPropertyKey: feign.httpclient
      newPropertyKey: spring.cloud.openfeign.httpclient
  - org.openrewrite.java.spring.ChangeSpringPropertyKey:
      oldPropertyKey: feign.compression
      newPropertyKey: spring.cloud.openfeign.compression
  - org.openrewrite.java.spring.ChangeSpringPropertyKey:
      oldPropertyKey: feign.circuitbreaker
      newPropertyKey: spring.cloud.openfeign.circuitbreaker
  - org.openrewrite.java.spring.ChangeSpringPropertyKey:
      oldPropertyKey: spring.sleuth.enabled
      newPropertyKey: management.tracing.enabled
  - org.openrewrite.java.spring.ChangeSpringPropertyKey:
      oldPropertyKey: spring.sleuth.sampler.probability
      newPropertyKey: management.tracing.sampling.probability
  - org.openrewrite.java.spring.DeleteSpringProperty:
      propertyKey: spring.zipkin.enabled
  - org.openrewrite.java.spring.ChangeSpringPropertyKey:
      oldPropertyKey: spring.zipkin.base-url
      newPropertyKey: management.zipkin.tracing.endpoint
