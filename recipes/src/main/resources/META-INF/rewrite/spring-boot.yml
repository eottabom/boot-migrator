# 러너가 단계별로 실행하는 레시피. upstream 은 직전 단계 체인을 뺀 UpgradeSpringBootStep_4_0 (upstream-spring-boot-steps.yml)
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.spring.SpringBootStep_4_0
displayName: "Spring Boot 4.0 단계 (이 단계의 변경만)"
description: >-
  Spring Boot 3.5 -> 4.0. Spring Framework 7, Spring Cloud 2025.1, Spring Cloud AWS 4.0, Hibernate 7.1, Gradle 8.14+,
  Testcontainers 2, 모듈형 starter, logstash-logback-encoder 9.
  Jackson 2 -> 3 코드 전환은 upstream UpgradeSpringFramework_7_0 이 UpgradeJackson_2_3 을 포함해서 이 단계에서 함께 된다.
preconditions:
  - org.openrewrite.Singleton
recipeList:
  # Boot 4.0 은 Gradle 8.14+ 가 필요하다. 러너는 compatibility.yml 을 보고 이 단계 전에 Gradle 단계를 따로 돌리므로
  # 보통은 이미 맞춰져 있고, 레시피를 단독으로 실행할 때를 위해 남겨 둔다 (이미 8.14 이상이면 바뀌지 않는다)
  - com.eottabom.rewrite.gradle.UpgradeGradleToolchain_8_14
  - com.eottabom.rewrite.spring.upstream.UpgradeSpringBootStep_4_0
  - com.eottabom.rewrite.spring.Boot4JpaRelocations
  # Hibernate 7 에서 org.hibernate.annotations.QueryHints 제거
  - com.eottabom.rewrite.hibernate.ReplaceAnnotationsQueryHints
  # Boot 4 BOM 이 spring-retry 를 관리하지 않아 transitive 로 받던 프로젝트에서 사라진다 (Framework 7 에 core retry 가 생김)
  - com.eottabom.rewrite.gradle.DeclareUsedDependency:
      packageName: org.springframework.retry
      groupId: org.springframework.retry
      artifactId: spring-retry
      version: 2.0.x
  - com.eottabom.rewrite.spring.Boot4RestDocsModule
  - com.eottabom.rewrite.spring.Boot4TestStartersForMainSources
  # Boot 4 에서 MockitoTestExecutionListener 가 제거돼 Spring 테스트(@DataJpaTest 등) 안의 @Mock/@InjectMocks 가 더 이상 자동 초기화되지 않는다
  # (upstream AddMockitoExtensionIfAnnotationsUsed 는 strict 모드라 기존 테스트가 UnnecessaryStubbingException 으로 깨진다)
  - com.eottabom.rewrite.testing.AddLenientMockitoExtension
  - com.eottabom.rewrite.logging.FixLogstashDecoratorForJackson3
  # upstream Jackson 3 전환이 catch (IOException) 를 catch (JacksonException) 로 바꿀 때 Files.readString 같은 진짜 IOException 을 놓치는 경우
  - com.eottabom.rewrite.jackson.FixJacksonIOExceptionCatch
  # Boot 4 는 JsonMapper 타입 빈이 있을 때만 자동 설정 매퍼가 물러난다. JsonMapper 를 돌려주는 @Bean ObjectMapper 의 반환 타입을 좁힌다
  - com.eottabom.rewrite.jackson.NarrowJsonMapperBeanReturnType
  # Boot 4 BOM 이 elasticsearch-java 를 9.x 로 올린다. HttpClient 5 기반 Rest5Client 로 옮기고, 매퍼를 Jackson 3 용으로 맞춘다
  - com.eottabom.rewrite.elasticsearch.MigrateToRest5Client
  - com.eottabom.rewrite.elasticsearch.ElasticsearchJava9ApiChanges
  # Spring Kafka 4 의 JacksonJsonSerializer 는 JsonMapper 만 받는다
  - com.eottabom.rewrite.kafka.UseJsonMapperForJacksonJsonSerializer
  - com.eottabom.rewrite.aws.UpgradeSpringCloudAws_4_0
  - com.eottabom.rewrite.logging.UpgradeLogstashEncoder_9
  - com.eottabom.rewrite.spring.UnpinSpringRestDocs
  # 이 단계의 설정 키 변경을 기동 로그로 확인하기 위해 (이미 있으면 그대로)
  - com.eottabom.rewrite.spring.AddPropertiesMigrator
  # upstream 버전 변경을 gradle/libs.versions.toml 에도 적용 (version-catalog-steps.yml, 생성 파일)
  - com.eottabom.rewrite.gradle.catalog.VersionCatalog_4_0
  - com.eottabom.rewrite.CommonMigrationFixes
---
